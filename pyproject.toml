# The engine behind the video-production skills.
#
# The skills in skills/ are prose and install with `npx skills add`, which only
# ever copies skills/<name>/ folders — it never looks at src/. Installing this
# package is therefore a separate, optional step, and nothing about the skills
# install story depends on it.

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "video-studio-engine"
version = "0.1.0"
description = "The programs behind the social-skills video skills: sourcing, voice, generation, measurement and editor handoff for short-form video."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Scrollmark" }]
keywords = ["video", "short-form", "social", "ffmpeg", "stock-footage", "tts"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Video",
]

# The base install is deliberately thin. httpx is the one dependency shared by
# enough modules (every stock source, every hosted generator) that installing
# without it leaves the package barely able to do anything.
dependencies = [
  "httpx>=0.27",
]

[project.optional-dependencies]
# Downloading footage from a URL.
sourcing = ["yt-dlp>=2024.1.0"]

# Local speech synthesis. kokoro has no wheels for 3.13+ at time of writing, so
# the marker keeps `pip install .[audio]` from failing outright on a newer
# interpreter — but the module will then raise at import, which is the honest
# outcome. Use a 3.11/3.12 environment for voice.
audio = [
  "kokoro>=0.9.0; python_version < '3.13'",
  "soundfile>=0.12",
  "numpy>=1.26",
]

# Checking a render against the plan it was built from: decoded frames, motion,
# audio structure, composition. Ported from the showwatcher analyzer. No models
# here — the model-backed checks live behind the qc-* extras below, so this one
# stays installable on a laptop.
qc = [
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "scenedetect>=0.6.4",
  "rapidfuzz>=3.9",
  "scipy>=1.14,<1.18",
]

# Model-backed QC, one extra per model so no single install drags in every one.
# Each maps to detectors the engine skips cleanly when the extra is absent.
qc-ocr = ["video-studio-engine[qc]", "easyocr>=1.7"]        # caption_sync, layout
qc-yolo = ["video-studio-engine[qc]", "ultralytics>=8.2", "supervision>=0.22"]
  # objects (YOLO detections) and entity_tracking (those detections through
  # ByteTrack, which is supervision — without it entity_tracking alone skips)
qc-face = ["video-studio-engine[qc]", "mediapipe>=0.10"]    # lip_sync's real backend
qc-clip = ["video-studio-engine[qc]", "fastembed>=0.3"]     # prompt_visual

# Word timings for narration this studio did not synthesise. Optional because
# it pulls a ~200MB CTranslate2 inference runtime that only gen_captions needs;
# tts_kokoro already emits timings for anything it speaks itself.
captions = ["faster-whisper>=1.0"]

# Hosted image/video/music models, plus the procedural boil renderer's PNG path.
generate = [
  "google-genai>=0.3",
  "pillow>=10",
]

# Segmentation, compositing and hand tracking. The heaviest extra by far.
vision = [
  "mediapipe>=0.10",
  "numpy>=1.26",
  "opencv-python>=4.9",
]

# Timeline interchange. CapCut and FCPXML need nothing; OTIO is only for
# export_edit.
export = [
  "opentimelineio>=0.17",
  "otio-fcpx-xml-adapter",
]

# Named "standard" and not "all" on purpose. It is everything a laptop wants and
# nothing that ships a model: no OCR, no YOLO, no CLIP, no mediapipe. It was
# called [all] for a day, which was a lie in the name — someone installing "all"
# and then watching four checks skip has been told two different things by the
# same package.
#
# [all] is gone rather than aliased, and that removal is NOT free: pip does not
# error on an unknown extra in a URL requirement, it does not even warn — it
# quietly installs the base package. So an old `[all]` command now silently
# gets less than it asks for. That is acceptable here only because the name
# existed for part of one day, was never published to an index, and every
# reference to it in this repo and on the website is rewritten in the same
# change. If it had ever shipped, the alias would be the right call.
standard = [
  "video-studio-engine[sourcing,audio,captions,generate,vision,export,qc]",
]

[project.scripts]
video-studio = "video_studio.cli:main"

[project.urls]
Homepage = "https://github.com/scrollmark/social-skills"
Source = "https://github.com/scrollmark/social-skills"

[tool.hatch.build.targets.wheel]
packages = ["src/video_studio"]

[tool.hatch.build.targets.sdist]
include = ["src/video_studio", "pyproject.toml", "README.md", "LICENSE"]
