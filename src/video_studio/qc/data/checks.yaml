# Prompt-fit checks: deterministic predicates over metrics and findings the
# engine already produced, per SocialBench taxonomy subcategory. Weighted pass
# fraction -> score; verdict pass >= 0.8, partial >= 0.5, else fail.
#
# expr grammar (evaluated by prompt_fit._eval, NOT python eval):
#   metric:<key> <op> <number>     op in > >= < <= ==
#   finding:<detector.CODE>        true when present
#   !finding:<detector.CODE>       true when absent
"2.1":
  name: Greenscreen / Reaction Commentary
  checks:
    - id: no-key-spill
      expr: "!finding:composition.KEY_SPILL"
      weight: 2
    - id: footage-matches-prompts
      expr: "metric:promptVisual.minMargin >= 0"
      weight: 1
    - id: subject-present
      expr: "!finding:objects.SUBJECT_MISSING"
      weight: 2
    - id: text-not-clipped
      expr: "!finding:layout.TEXT_CLIPPED"
      weight: 1
"3.3":
  name: ASMR & Oddly Satisfying
  checks:
    - id: av-coupling
      expr: "metric:avSync.correlation >= 0.2"
      weight: 3
    - id: onset-match
      expr: "metric:avSync.onsetMatchRate >= 0.7"
      weight: 3
    - id: audio-present
      expr: "!finding:container.NO_AUDIO_STREAM"
      weight: 2
    - id: audio-level
      expr: "metric:audio.integratedLufs >= -24"
      weight: 1
"4.1":
  name: Duet / Stitch
  checks:
    - id: two-panes
      expr: "metric:composition.paneCount >= 2"
      weight: 3
    - id: panes-independent
      expr: "metric:composition.paneMotionCorrelation <= 0.35"
      weight: 2
    - id: no-missing-pane
      expr: "!finding:composition.MISSING_PANE"
      weight: 2
"4.2":
  name: Lip-Sync / Dance / Trend
  checks:
    - id: lip-offset
      expr: "metric:lipSync.offsetMs <= 100"
      weight: 3
    - id: lip-coupling
      expr: "metric:lipSync.correlation >= 0.3"
      weight: 3
    - id: av-global
      expr: "metric:avSync.correlation >= 0.2"
      weight: 1
"4.3":
  name: Skit / Roleplay (Multi-Character)
  checks:
    - id: two-characters
      expr: "finding:entity_tracking.SAME_ACTOR_TWO_CHARACTERS"
      weight: 3
    - id: person-present
      expr: "!finding:objects.SUBJECT_MISSING"
      weight: 1
"3.1":
  name: Step-by-Step / Recipe / DIY
  checks:
    - id: cuts-on-plan
      expr: "!finding:scene_sync.CUMULATIVE_DRIFT"
      weight: 2
    - id: subjects-shown
      expr: "!finding:objects.SUBJECT_MISSING"
      weight: 2
    - id: steps-match-prompts
      expr: "metric:promptVisual.minMargin >= 0"
      weight: 2
"3.2":
  name: Haul & Unboxing / Product Demo
  checks:
    - id: product-shown
      expr: "!finding:entity_tracking.PRODUCT_NOT_SHOWN"
      weight: 3
    - id: product-dwell
      expr: "!finding:entity_tracking.PRODUCT_TOO_BRIEF"
      weight: 1
    - id: footage-matches-prompts
      expr: "metric:promptVisual.meanClipScore >= 0.18"
      weight: 1
